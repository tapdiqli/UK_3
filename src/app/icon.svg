<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Slots favicon">
  <!-- Body -->
  <rect width="64" height="64" rx="14" fill="#121212"/>
  <rect x="4" y="4" width="56" height="56" rx="12" fill="none" stroke="#C1121F" stroke-width="2"/>

  <!-- Slot machine cabinet -->
  <rect x="12" y="10" width="40" height="44" rx="6" fill="#1b1b1b" stroke="#C1121F" stroke-width="1.75"/>

  <!-- Top lamp -->
  <rect x="26" y="7" width="12" height="5" rx="2" fill="#C1121F"/>

  <!-- Reel window -->
  <rect x="17" y="20" width="30" height="22" rx="3" fill="#0b0b0b" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Three reels -->
  <rect x="19" y="22" width="8" height="18" rx="1.5" fill="#242424"/>
  <rect x="28" y="22" width="8" height="18" rx="1.5" fill="#242424"/>
  <rect x="37" y="22" width="8" height="18" rx="1.5" fill="#242424"/>

  <!-- 7 7 7 -->
  <text x="23" y="35.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-weight="700" fill="#C1121F">7</text>
  <text x="32" y="35.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-weight="700" fill="#FFFFFF">7</text>
  <text x="41" y="35.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-weight="700" fill="#C1121F">7</text>

  <!-- Lever -->
  <circle cx="54" cy="26" r="3.2" fill="#C1121F"/>
  <rect x="52.6" y="26" width="2.8" height="14" rx="1.2" fill="#E23140"/>
  <circle cx="54" cy="41" r="2.2" fill="#FFFFFF"/>

  <!-- Payline -->
  <line x1="17" y1="31" x2="47" y2="31" stroke="#C1121F" stroke-width="1" stroke-opacity="0.55"/>

  <!-- Base bar -->
  <rect x="20" y="46" width="24" height="4" rx="2" fill="#C1121F"/>
</svg>
